<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="haloGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c5a059" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#c5a059" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0e0e11" stop-opacity="0"/>
    </radialGradient>

    <!-- Bezel Metallic Gradients -->
    <linearGradient id="goldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1b5"/>
      <stop offset="25%" stop-color="#c5a059"/>
      <stop offset="50%" stop-color="#7a5f27"/>
      <stop offset="75%" stop-color="#dfc18c"/>
      <stop offset="100%" stop-color="#99742e"/>
    </linearGradient>

    <linearGradient id="charcoalDial" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1c20"/>
      <stop offset="50%" stop-color="#0f0f12"/>
      <stop offset="100%" stop-color="#08080a"/>
    </linearGradient>

    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#f0ddb2"/>
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Ambient Golden Glow -->
  <circle cx="400" cy="400" r="360" fill="url(#haloGlow)"/>

  <!-- Watch Strap - Top Portion -->
  <path d="M 330 40 L 470 40 L 450 200 L 350 200 Z" fill="#141418" stroke="#26262e" stroke-width="2"/>
  <line x1="340" y1="60" x2="460" y2="60" stroke="#c5a059" stroke-opacity="0.3" stroke-width="1"/>
  <line x1="345" y1="100" x2="455" y2="100" stroke="#c5a059" stroke-opacity="0.2" stroke-width="1"/>

  <!-- Watch Strap - Bottom Portion -->
  <path d="M 350 600 L 450 600 L 470 760 L 330 760 Z" fill="#141418" stroke="#26262e" stroke-width="2"/>
  <line x1="345" y1="700" x2="455" y2="700" stroke="#c5a059" stroke-opacity="0.2" stroke-width="1"/>
  <line x1="340" y1="740" x2="460" y2="740" stroke="#c5a059" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Watch Case and Outer Bezel -->
  <g filter="url(#dropShadow)">
    <!-- Case Lugs -->
    <path d="M 310 180 C 310 120, 330 80, 340 70 L 370 190 Z" fill="#202026"/>
    <path d="M 490 180 C 490 120, 470 80, 460 70 L 430 190 Z" fill="#1c1c22"/>
    <path d="M 310 620 C 310 680, 330 720, 340 730 L 370 610 Z" fill="#202026"/>
    <path d="M 490 620 C 490 680, 470 720, 460 730 L 430 610 Z" fill="#1c1c22"/>

    <!-- Crown & Pushers -->
    <!-- Top Chrono Pusher -->
    <rect x="635" y="320" width="16" height="24" rx="3" fill="url(#goldBezel)"/>
    <!-- Center Crown -->
    <rect x="640" y="380" width="22" height="40" rx="4" fill="url(#goldBezel)"/>
    <!-- Bottom Chrono Pusher -->
    <rect x="635" y="456" width="16" height="24" rx="3" fill="url(#goldBezel)"/>

    <!-- Outer Gold Ring -->
    <circle cx="400" cy="400" r="250" fill="url(#goldBezel)" stroke="#0e0e11" stroke-width="4"/>
    <!-- Fluted Bezel Ring -->
    <circle cx="400" cy="400" r="236" fill="#141417" stroke="url(#goldBezel)" stroke-width="6"/>
    <!-- Inner Gold Bezel Ring -->
    <circle cx="400" cy="400" r="226" fill="none" stroke="url(#goldAccent)" stroke-width="2"/>
    <!-- Main Dial Face -->
    <circle cx="400" cy="400" r="222" fill="url(#charcoalDial)"/>
  </g>

  <!-- Dial Minute Track Outer Dots -->
  <circle cx="400" cy="400" r="212" fill="none" stroke="#c5a059" stroke-opacity="0.3" stroke-width="1" stroke-dasharray="2 8"/>

  <!-- Sub-Dials (Chronograph) -->
  <!-- 12 O'Clock Subdial (30-min counter) -->
  <circle cx="400" cy="305" r="44" fill="#121215" stroke="url(#goldBezel)" stroke-width="1.5"/>
  <circle cx="400" cy="305" r="40" fill="none" stroke="#c5a059" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="2 4"/>
  <line x1="400" y1="305" x2="415" y2="285" stroke="#dfc18c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 9 O'Clock Subdial (Small Seconds) -->
  <circle cx="305" cy="400" r="44" fill="#121215" stroke="url(#goldBezel)" stroke-width="1.5"/>
  <circle cx="305" cy="400" r="40" fill="none" stroke="#c5a059" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="2 4"/>
  <line x1="305" y1="400" x2="295" y2="380" stroke="#dfc18c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- 6 O'Clock Subdial (12-hour counter) -->
  <circle cx="400" cy="495" r="44" fill="#121215" stroke="url(#goldBezel)" stroke-width="1.5"/>
  <circle cx="400" cy="495" r="40" fill="none" stroke="#c5a059" stroke-opacity="0.2" stroke-width="0.5" stroke-dasharray="2 4"/>
  <line x1="400" y1="495" x2="385" y2="515" stroke="#dfc18c" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Brand Typography on Dial -->
  <text x="400" y="375" text-anchor="middle" font-family="'Cinzel', Georgia, serif" font-size="11" letter-spacing="4" fill="#f0ddb2" font-weight="600">CRUEZE</text>
  <text x="400" y="388" text-anchor="middle" font-family="sans-serif" font-size="7" letter-spacing="3" fill="#c5a059">TIMELINE</text>
  <text x="400" y="432" text-anchor="middle" font-family="sans-serif" font-size="7" letter-spacing="2" fill="#a1a1aa">AUTOMATIC</text>
  <text x="400" y="442" text-anchor="middle" font-family="sans-serif" font-size="6" letter-spacing="1.5" fill="#71717a">SHOWROOM CURATION</text>

  <!-- Hour Indices (Gold Batons) -->
  <!-- 12 O'Clock Double Baton -->
  <rect x="396" y="200" width="3" height="24" rx="1.5" fill="url(#goldBezel)"/>
  <rect x="401" y="200" width="3" height="24" rx="1.5" fill="url(#goldBezel)"/>
  <!-- 1 O'Clock -->
  <rect x="495" y="235" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(30 497 246)"/>
  <!-- 2 O'Clock -->
  <rect x="560" y="300" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(60 562 311)"/>
  <!-- 3 O'Clock Date Window -->
  <rect x="536" y="388" width="36" height="24" rx="2" fill="#18181c" stroke="url(#goldBezel)" stroke-width="1.5"/>
  <text x="554" y="405" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dfc18c">28</text>
  <!-- 4 O'Clock -->
  <rect x="560" y="480" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(120 562 491)"/>
  <!-- 5 O'Clock -->
  <rect x="495" y="545" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(150 497 556)"/>
  <!-- 6 O'Clock -->
  <rect x="398" y="575" width="4" height="22" rx="1.5" fill="url(#goldBezel)"/>
  <!-- 7 O'Clock -->
  <rect x="300" y="545" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(210 302 556)"/>
  <!-- 8 O'Clock -->
  <rect x="235" y="480" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(240 237 491)"/>
  <!-- 9 O'Clock -->
  <rect x="200" y="389" width="22" height="4" rx="1.5" fill="url(#goldBezel)"/>
  <!-- 10 O'Clock -->
  <rect x="235" y="300" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(300 237 311)"/>
  <!-- 11 O'Clock -->
  <rect x="300" y="235" width="4" height="22" rx="1.5" fill="url(#goldBezel)" transform="rotate(330 302 246)"/>

  <!-- Watch Hands -->
  <!-- Hour Hand -->
  <g filter="url(#dropShadow)">
    <path d="M 395 400 L 398 290 L 400 280 L 402 290 L 405 400 Z" fill="url(#goldBezel)" stroke="#0e0e11" stroke-width="0.5"/>
    <path d="M 398 310 L 402 310 L 401 370 L 399 370 Z" fill="#faf8f5" fill-opacity="0.8"/>
  </g>

  <!-- Minute Hand -->
  <g filter="url(#dropShadow)" transform="rotate(68 400 400)">
    <path d="M 396 400 L 398 235 L 400 220 L 402 235 L 404 400 Z" fill="url(#goldBezel)" stroke="#0e0e11" stroke-width="0.5"/>
    <path d="M 398 250 L 402 250 L 401 360 L 399 360 Z" fill="#faf8f5" fill-opacity="0.8"/>
  </g>

  <!-- Chrono Seconds Hand (Slim Gold Needle) -->
  <g transform="rotate(220 400 400)">
    <line x1="400" y1="460" x2="400" y2="210" stroke="#f0ddb2" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="400" cy="400" r="7" fill="url(#goldBezel)"/>
    <circle cx="400" cy="400" r="3" fill="#0e0e11"/>
    <circle cx="400" cy="435" r="4" fill="url(#goldBezel)"/>
  </g>

  <!-- Crystal Glare / Light Reflection -->
  <path d="M 240 280 C 330 200, 480 200, 560 280 C 470 230, 320 230, 240 280 Z" fill="#ffffff" fill-opacity="0.07"/>
</svg>
